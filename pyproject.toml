[project]
name = "context-drift-agent"
version = "0.1.0"
description = "Open-source DataHub agent that detects stale metadata context after schema changes"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "requests>=2.31",
    "acryl-datahub>=0.14",
    "anthropic>=0.30",
    "openai>=1.30",
]

[project.scripts]
context-drift-agent = "agent.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.14",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
