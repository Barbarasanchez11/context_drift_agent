[project]
name = "context-drift-agent"
version = "0.1.0"
description = "Open-source DataHub agent that detects stale metadata context after schema changes"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "requests>=2.31",
    "acryl-datahub>=0.14",
    "anthropic>=0.30",
    "openai>=1.30",
    "groq>=0.9",
    "mcp>=1.0",
]

[project.scripts]
context-drift-agent = "agent.__main__:main"
context-drift-mcp   = "agent.mcp_server:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.14",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "pyright>=1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["agent"]

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "basic"
include = ["agent", "tests"]
